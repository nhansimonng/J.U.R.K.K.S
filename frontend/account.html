<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account · Pump Check</title><link rel="stylesheet" href="css/styles.css?v=all-pages-4">
<link rel="icon" type="image/png" href="assets/favicon.png"></head>
<body class="page-account"><header id="navbar"></header><main id="main" class="container stack">
<div id="message" class="alert" hidden></div><section class="page-intro"><div><p class="eyebrow">YOUR OWN CORNER</p><h1>Account settings</h1><p class="intro-description">A few personal details. A space that feels like you.</p></div><img src="assets/account-art.svg" alt="" width="160" height="160"></section>
<section class="card"><h2>Profile</h2><p id="account-email" class="muted">Loading account…</p>
<form id="profile-form" class="stack">
<div><label for="username">Username</label><input id="username" required maxlength="50" autocomplete="username"></div>
<button class="btn" type="submit" id="save-profile" disabled>Save username</button></form></section>
<section class="card"><h2>Change password</h2>
<p class="hint">Use at least 8 characters. Your current password is required.</p>
<form id="password-form" class="stack">
<div><label for="current-password">Current password</label><input id="current-password" type="password" required maxlength="1024" autocomplete="current-password"></div>
<div><label for="new-password">New password</label><input id="new-password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password"></div>
<div><label for="confirm-password">Confirm new password</label><input id="confirm-password" type="password" required minlength="8" maxlength="1024" autocomplete="new-password"></div>
<button class="btn" type="submit">Change password</button></form></section></main>
<script type="module" src="js/account.js?v=account-1"></script></body></html>
