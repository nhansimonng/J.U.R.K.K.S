<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Community plans · Pump Check</title>
  <link rel="stylesheet" href="css/styles.css?v=all-pages-4">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="page-community">
  <header id="navbar"></header>

  <main id="main" class="container stack">
    <section class="page-intro"><div><p class="eyebrow">TRAIN BETTER, TOGETHER</p><h1>Community plans</h1><p class="intro-description">Find inspiration, discover routines, and save plans worth trying.</p></div><img src="assets/community-art.svg" alt="" width="160" height="160"></section>

    <div class="row view-tabs" role="group" aria-label="Choose a view">
      <button id="tab-browse" class="btn" type="button" aria-pressed="true">Browse</button>
      <button id="tab-recommended" class="btn btn-secondary" type="button" aria-pressed="false">Recommendations</button>
      <button id="tab-saved" class="btn btn-secondary" type="button" aria-pressed="false">Saved plans</button>
    </div>

    <div id="message" class="alert" hidden></div>

    <p id="recommendation-hint" class="hint" hidden>Choose a goal or muscle group to find matching public plans and your own plans. Suggestions use these filters, not AI.</p>

    <form id="filter-form" class="card" novalidate>
      <div class="row">
        <div>
          <label for="goal">Goal</label>
          <select id="goal">
            <option value="">Any goal</option>
            <option value="muscle_gain">Muscle gain</option>
            <option value="strength">Strength</option>
            <option value="fat_loss">Fat loss</option>
            <option value="endurance">Endurance</option>
            <option value="general_fitness">General fitness</option>
          </select>
        </div>
        <div class="grow">
          <label for="muscle-group">Muscle group</label>
          <input id="muscle-group" type="text" maxlength="200" placeholder="e.g. legs, chest">
        </div>
        <button class="btn" type="submit">Filter</button>
        <button id="clear-filter" class="btn btn-secondary" type="button">Clear</button>
      </div>
    </form>

    <p id="empty" class="muted empty-state" hidden></p>
    <div id="plans" class="grid"></div>
    <div class="row" style="justify-content: center;">
      <button id="load-more" class="btn btn-secondary" type="button" hidden>Load more</button>
    </div>
  </main>

  <script type="module" src="js/community.js?v=account-1"></script>
</body>
</html>
