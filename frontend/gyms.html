<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Find a gym · Pump Check</title>
  <link rel="stylesheet" href="css/styles.css?v=all-pages-4">
  <link rel="icon" type="image/png" href="assets/favicon.png">
</head>
<body class="page-gyms">
  <header id="navbar"></header>

  <main id="main" class="container stack">
    <section class="page-intro"><div><p class="eyebrow">FIND YOUR SPACE</p><h1>Find a gym</h1><p class="intro-description">A great workout starts with the right place. Explore gyms and their equipment.</p></div><img src="assets/gyms-art.svg" alt="" width="160" height="160"></section>

    <div id="message" class="alert" hidden></div>

    <form id="search-form" class="card" novalidate>
      <h2>Where do you want to train?</h2><div class="row">
        <div class="grow">
          <label for="query">Gym name or location</label>
          <input id="query" type="search" maxlength="200" placeholder="e.g. San Jose or Planet Fitness">
        </div>
        <button class="btn" type="submit">Search</button>
      </div>

      <div class="row" style="margin-top: 1rem;">
        <div class="grow">
          <label for="equipment">Equipment (optional)</label>
          <input id="equipment" type="text" maxlength="200" placeholder="squat rack, leg press">
        </div>
        <div>
          <label for="radius">Distance</label>
          <select id="radius">
            <option value="8">5 miles</option>
            <option value="16" selected>10 miles</option>
            <option value="32">20 miles</option>
          </select>
        </div>
        <button id="near-me" class="btn btn-secondary" type="button">Use my location</button>
      </div>
      <p class="hint">Separate equipment with commas. Only gyms that have all of it are shown.</p>
      <p id="location-status" class="hint" aria-live="polite"></p>
    </form>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Results</h2>
      <p id="result-count" class="muted" aria-live="polite"></p>
      <div id="results" class="grid"></div>
    </section>
  </main>

  <script type="module" src="js/gyms.js?v=account-1"></script>
</body>
</html>
